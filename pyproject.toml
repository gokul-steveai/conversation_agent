[project]
name = "conversation-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.3.14",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.10",
    "pydantic>=2.13.4",
    "pygraphviz>=2.0.1",
    "python-dotenv>=1.2.2",
    "streamlit>=1.61.1",
    "tavily-python>=0.7.27",
]

[dependency-groups]
dev = [
    "ruff>=0.16.2",
]

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E402", "W293"]


